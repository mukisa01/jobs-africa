services:
  db:
    image: postgres:16
    container_name: jobs-africa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobsafrica
      POSTGRES_PASSWORD: jobsafrica123
      POSTGRES_DB: jobs_africa
    ports:
      - "5432:5432"
    volumes:
      - jobs_africa_data:/var/lib/postgresql/data

volumes:
  jobs_africa_data: